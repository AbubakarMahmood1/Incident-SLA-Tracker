services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident
      POSTGRES_DB: incident_sla
    volumes:
      - incident_sla_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident -d incident_sla"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [backend]

  migrate:
    build: .
    environment: &application_environment
      APP_ENV: development
      JWT_SECRET: local-development-secret-change-before-sharing
      DATABASE_URL: postgresql+psycopg://incident:incident@postgres:5432/incident_sla
      OUTBOX_TRANSPORT: console
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  api:
    build: .
    environment: *application_environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend, edge]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  worker:
    build: .
    environment: *application_environment
    command: ["incident-sla-worker", "run"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend, egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

networks:
  backend:
    internal: true
  edge:
  egress:


volumes:
  incident_sla_postgres:

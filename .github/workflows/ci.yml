name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_PYTHON_DOWNLOADS: "never"
  UV_VERSION: "0.11.33"
  APP_ENV: test
  JWT_SECRET: ci-test-secret-that-is-long-enough-to-use

jobs:
  source:
    name: source / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-extras
      - run: uv run --locked ./scripts/verify-source.sh
      - run: uv pip check
      - if: matrix.python == '3.13'
        run: ./scripts/audit-dependencies.sh

  postgres:
    name: PostgreSQL migration and concurrency evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: incident
          POSTGRES_PASSWORD: incident
          POSTGRES_DB: incident_sla_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incident -d incident_sla_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://incident:incident@127.0.0.1:5432/incident_sla_test
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-extras
      - run: uv run --locked ./scripts/verify.sh
      - run: uv pip check

  documentation:
    name: Mermaid render evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: python3 scripts/verify-docs.py
      - run: >-
          python3 scripts/render-diagrams.py
          --output "$RUNNER_TEMP/incident-sla-diagrams"
          --render
          --no-sandbox

  container:
    name: container and Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - run: docker build --tag incident-sla-ledger:${{ github.sha }} .
      - name: Scan source controls
        run: >-
          docker run --rm
          -v "$PWD:/workspace:ro"
          aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
          fs
          --scanners secret,misconfig
          --severity HIGH,CRITICAL
          --exit-code 1
          /workspace
      - name: Scan built image
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
          image
          --scanners vuln
          --severity HIGH,CRITICAL
          --exit-code 1
          incident-sla-ledger:${{ github.sha }}
      - run: ./scripts/compose-smoke.sh
